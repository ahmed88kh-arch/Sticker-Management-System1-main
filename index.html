<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی بەڕێوەبردنی ستیکەر - چوونەژوورەوە</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Splash Screen Overlay -->
    <div id="splashScreen" class="splash-screen">
        <img src="logo.png" alt="StickerPro Logo" class="splash-logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'150\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%230066ff\' rx=\'20\'/><text x=\'50\' y=\'65\' font-size=\'50\' text-anchor=\'middle\' fill=\'white\'>🎨</text></svg>'">
        <div class="splash-loader"></div>
        <h2 class="splash-title">Sticker Management System</h2>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <img src="logo.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
                <h1>StickerPro</h1>
                <p>سیستەمی بەڕێوەبردنی ستیکەر</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">ناوی بەکارهێنەر</label>
                    <input type="text" id="username" placeholder="ناوی بەکارهێنەرەکەت لێبدە" required>
                </div>
                
                <div class="input-group">
                    <label for="password">وشەی نهێنی</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="login-btn">چوونەژوورەوە</button>
                
                <div class="status-msg" id="statusMsg"></div>
            </form>
            
            <div class="login-footer">
                <p>&copy; ٢٠٢٦ StickerPro. هەموو مافەکان پارێزراوە.</p>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
    <script>
        // Check theme preference on startup
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }

        // Splash screen logic
        window.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('splashScreen');
            // Hide splash screen after 2.5 seconds
            setTimeout(() => {
                splash.classList.add('hidden');
            }, 2500);
        });
    </script>
</body>
</html>
